# Target employers with Bengaluru product teams.
#
# ats:    auto       -> the agent tries Greenhouse, Lever, Ashby and SmartRecruiters
#                       using `slugs` (or names derived from `name`) and remembers what works
#         workday    -> needs `workday: {host, site}`
#         none       -> no public feed; jobs arrive from job-alert emails (Phase 1b)
# offices: Bengaluru office areas used for commute checks. Approximate - an area
#          or tech park is enough for a peak-hour estimate. Add or fix as needed.
# tier:   gcc | mnc | unicorn | growth | startup

companies:
  # --- Global capability centres / MNCs ---------------------------------------
