# Search preferences. Nothing personal goes here: home address, resume and keys
# come from GitHub Secrets (see README).

titles:
  # Matched case-insensitively against the job title.
  primary:
    - vp product
    - vice president.*product
    - avp.*product
    - head of product
    - director.*product
    - product.*director
    - group product manager
    - principal product manager
    - lead product manager
    - senior manager.*product
    - product lead
    - chief product officer
  # Shown only when the company is well-known (reputation >= 4) or pays >= the floor.
  secondary:
    - senior product manager
    - sr\.? product manager
    - product manager iii
    - staff product manager
  # Titles to drop even if they match above.
  exclude:
    - product marketing
    - product designer
    - product analyst
    - project manager
    - program manager
    - product owner
    - associate product
    - intern
    - engineering manager
    - product support
    - product specialist

location:
  # A job is kept if its location mentions one of these, or it is remote in India.
  include: [bengaluru, bangalore, karnataka]
  remote_ok: true

work_mode:
  max_office_days_per_week: 3
  keep_unknown: true # keep and mark "verify" when the post doesn't say

commute:
  # Morning peak on the next weekday, Asia/Kolkata.
  peak_departure_local: "09:30"
  max_minutes_car_or_bike: 40
  max_minutes_metro: 60

salary:
  min_ctc_lpa: 60 # CTC without ESOPs
  # When pay is not stated, keep only companies rated at least this (1-5).
  min_reputation_if_unknown: 4

scoring:
  min_fit_score: 55 # 0-100; lower-scored jobs are left out of the digest

# Never show jobs from these (current employer and its group).
exclude_companies:
  - xoxoday
  - plum
  - empuls
  - compass by xoxoday

# Never send outreach to these: Xoxoday's small and mid-size direct clients.
# Large companies and big GCCs are deliberately NOT listed here, even if they
# are Xoxoday clients - they are too big for it to matter.
outreach_blocklist: []

email:
  send_hour_local: 9
  timezone: Asia/Kolkata

prep:
  # Focus for case studies and interview guides.
  focus_companies: [MNC GCCs (Walmart, Intuit, Atlassian, Salesforce, Adobe), Razorpay, PhonePe, CRED, Groww]
  minutes_per_day: 30
  search_start: 2026-11-01
  target_months: 8
